<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Base Title{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <main>
        <div class="container">
            <header class="d-flex flex-wrap justify-content-md-between py-3 mb-4 border-bottom">

                <ul class="nav col-12 col-md-auto mb-2 justify-content-left mb-md-0">
                    <li><a href="{% url 'locations:home' %}" class="nav-link px-2 link-secondary">Home</a></li>
                    <li><a href="{% url 'locations:home' %}" class="nav-link px-2 link-dark">Features</a></li>
                    <li><a href="{% url 'locations:home' %}" class="nav-link px-2 link-dark">FAQs</a></li>
                    <li><a href="{% url 'locations:home' %}" class="nav-link px-2 link-dark">About</a></li>
                </ul>

                <div class="col-md-3 text-end">
                    <ul class="nav col-6 col-md-auto mb-2 mb-md-0">
                        {% if user.is_authenticated %}

                        <li><a class="nav-link px-3 link-dark" style="font-weight: 600;">{{ user.username }}</a></li>
                        <li>
                            <form action="{% url 'logout' %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-primary me-2">Log Out</button>
                            </form>
                        </li>

                        {% else %}

                        <li>
                            <form action="{% url 'login' %}" method="get">
                                <button type="submit" class="btn btn-outline-primary me-2">Login</button>
                            </form>
                        </li>
                        <li>
                            <form action="{% url 'signup' %}" method="get">
                                <button type="submit" class="btn btn-primary">Sign-up</button>
                            </form>
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </header>
        </div>

        <div class="container">
            <div class="row justify-content-center" style="margin-top: 3em;">
                <div class="col-md-8">

                    <div class="search-container">
                        <form role="search" method="get" action="/search" class="d-flex">
                            <input type="search" class="form-control search-input" name="q"
                                placeholder="ex: Санкт-Петербург, Moscow, Лондон, Индия, etc." required />
                            <button type="submit" class="btn btn-outline-secondary ms-2">&#128269;</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

        {% block content %}

        {% endblock %}

        <footer class="footer mt-auto py-3 bg-light">
            <div class="container">
                <span class="text-muted">&copy; 2025 Copyright: ITMO University</span>
            </div>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
